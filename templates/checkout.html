{% extends "base.html" %}

{% block title %}
Checkout | Nazif's Scents
{% endblock %}


{% block content %}

<section class="page-header">

    <p>CHECKOUT</p>

    <h1>
        Complete your order
    </h1>

</section>


<section class="checkout">

    {% if complete %}

        <div class="success">

            <h2>
                Thank you for your order!
            </h2>

            <p>
                Your Nazif's Scents order has been received.
            </p>

            <a href="/shop" class="button">
                CONTINUE SHOPPING
            </a>

        </div>

    {% else %}

        <form method="POST">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                required
            >


            <label>
                Delivery Address
            </label>

            <textarea
                name="address"
                required
            ></textarea>


            <button
                type="submit"
                class="button"
            >
                PLACE ORDER
            </button>

        </form>

    {% endif %}

</section>

{% endblock %}
